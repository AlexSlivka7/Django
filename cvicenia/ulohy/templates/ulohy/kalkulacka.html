<form method="post">
    {% csrf_token %} 
    <input type="number" name="a" required> 
    <select name="operacia">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>
    <input type="number" name="b" required>
    <button>Vypočítať</button>
</form>
{% if vysledok is not None %}
    <p>Výsledok: {{ vysledok }}</p>
{% endif %}
